<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nethack Mode</title>
    <style>
        body {
            background-color: #000;
            color: #ccc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #fff;
            text-shadow: 0 0 5px #fff;
        }

        #dungeon-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #dungeon {
            background-color: #111;
            color: #ccc;
            font-size: 20px;
            line-height: 20px;
            white-space: pre;
            cursor: default;
            user-select: none;
            /* No CSS border, using ASCII border */
        }

        #status-line {
            margin-top: 10px;
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            color: #fff;
        }

        #code-display {
            width: 100%;
            max-width: 600px;
            height: 150px;
            background-color: #111;
            border: 1px solid #333;
            padding: 10px;
            margin-top: 20px;
            white-space: pre-wrap;
            overflow-y: auto;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
        }

        #controls-hint {
            margin-top: 10px;
            color: #666;
            font-size: 14px;
        }

        #macro-controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 5px;
            font-family: 'Courier New', Courier, monospace;
        }

        button {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 5px 10px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
        }

        button:hover {
            background: #444;
        }
    </style>
</head>

<body>
    <h1>Nethack Mode</h1>

    <div id="status-line">
        <span id="player-stats">St:18 Dx:16 Co:18 In:18 Wi:18 Ch:18</span>
        <span id="dungeon-level">Dlvl:1</span>
    </div>

    <div id="dungeon-container">
        <div id="dungeon"></div>
    </div>

    <div id="code-display"></div>

    <div id="macro-controls">
        <input type="text" id="macro-input" placeholder="Enter moves (e.g. hhj.k)" value="hhj.khjll.">
        <button id="play-btn">Play Macro</button>
    </div>

    <div id="controls-hint">Use HJKL to move, . or , to pick up.</div>

    <script>
        class NethackInterpreter {
            constructor() {
                this.x = 6;
                this.y = 2;
                this.output = "";
                this.layout = [
                    ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'],
                    ['q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p'],
                    ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', ';'],
                    ['z', 'x', 'c', 'v', 'b', 'n', 'm', ',', '.', '/'],
                    [' ', ' ', ' ', ' ', ' ', ' ', ' ', ' ', ' ', ' '],
                    ['!', '@', '#', '$', '%', '^', '&', '*', '(', ')'],
                    ['-', '_', '=', '+', '[', ']', '{', '}', '\\', '|'],
                    [':', ';', '"', '\'', '<', '>', '?', '`', '~', '←'],
                    ['↵', ' ', ' ', ' ', ' ', ' ', ' ', ' ', ' ', ' ']
                ];
            }

            // Process a single character and update state
            step(char) {
                switch (char) {
                    case 'h':
                        this.x = Math.max(0, this.x - 1);
                        break;
                    case 'l':
                        const rowLen = this.layout[this.y] ? this.layout[this.y].length : 10;
                        this.x = Math.min(rowLen - 1, this.x + 1);
                        break;
                    case 'k':
                        this.y = Math.max(0, this.y - 1);
                        if (this.layout[this.y]) this.x = Math.min(this.layout[this.y].length - 1, this.x);
                        break;
                    case 'j':
                        this.y = Math.min(this.layout.length - 1, this.y + 1);
                        if (this.layout[this.y]) this.x = Math.min(this.layout[this.y].length - 1, this.x);
                        break;
                    case '.':
                    case ',':
                        this.pickUp();
                        break;
                }
            }

            pickUp() {
                if (this.y >= 0 && this.y < this.layout.length) {
                    const row = this.layout[this.y];
                    if (this.x >= 0 && this.x < row.length) {
                        const char = row[this.x];
                        if (char === '←') {
                            this.output = this.output.slice(0, -1);
                        } else if (char === '↵') {
                            this.output += '\n';
                        } else {
                            this.output += char;
                        }
                    }
                }
            }
        }

        const interpreter = new NethackInterpreter();
        const dungeonEl = document.getElementById('dungeon');
        const codeDisplay = document.getElementById('code-display');
        let nethackCode = "";

        function renderDungeon() {
            // ASCII Art Rendering with Borders
            let s = "";
            const width = 10; // Max width of layout

            // Top Border
            s += "+";
            for (let i = 0; i < width * 2 + 1; i++) s += "-";
            s += "+\n";

            for (let y = 0; y < interpreter.layout.length; y++) {
                s += "| ";
                for (let x = 0; x < width; x++) {
                    let char = " ";
                    if (interpreter.layout[y] && x < interpreter.layout[y].length) {
                        char = interpreter.layout[y][x];
                    }

                    if (x === interpreter.x && y === interpreter.y) {
                        s += "@ "; // Cursor
                    } else {
                        s += char + " ";
                    }
                }
                // Pad if row is short (though we iterate to width)
                s += "|\n";
            }

            // Bottom Border
            s += "+";
            for (let i = 0; i < width * 2 + 1; i++) s += "-";
            s += "+";

            dungeonEl.textContent = s;
        }

        renderDungeon();

        document.addEventListener('keydown', (e) => {
            // Don't capture if typing in input
            if (e.target.tagName === 'INPUT') return;

            const key = e.key.toLowerCase();
            if (['h', 'j', 'k', 'l', '.', ','].includes(key)) {
                nethackCode += key;
                interpreter.step(key);
                codeDisplay.textContent = interpreter.output;
                renderDungeon();
            }
        });

        // Animation Logic
        const playBtn = document.getElementById('play-btn');
        const macroInput = document.getElementById('macro-input');

        playBtn.addEventListener('click', async () => {
            const moves = macroInput.value;
            if (!moves) return;

            // Reset interpreter for clean run? Or continue?
            // User probably wants to run a macro from current state or reset?
            // Let's assume continue for now, or maybe we should reset to make it predictable.
            // But "macro" implies automating steps. 
            // Let's just run steps.

            playBtn.disabled = true;

            for (const char of moves) {
                if (['h', 'j', 'k', 'l', '.', ','].includes(char)) {
                    interpreter.step(char);
                    codeDisplay.textContent = interpreter.output;
                    renderDungeon();
                    await new Promise(r => setTimeout(r, 200)); // 200ms delay
                }
            }

            playBtn.disabled = false;
        });
    </script>
</body>

</html>
