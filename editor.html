<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Code Editor</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        #editor-container {
            display: flex;
            gap: 20px;
        }

        #canvas-container {
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        #sidebar {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #palette {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            background: #252526;
            padding: 10px;
            border-radius: 5px;
        }

        button {
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            flex-grow: 1;
        }

        button:hover {
            opacity: 0.8;
        }

        .control-group {
            background: #252526;
            padding: 10px;
            border-radius: 5px;
        }

        input,
        select {
            width: 100%;
            padding: 5px;
            margin-top: 5px;
            background: #3c3c3c;
            border: 1px solid #555;
            color: white;
        }

        #compile-btn {
            background-color: #0e639c;
            color: white;
            font-size: 16px;
            padding: 10px;
            margin-top: 20px;
        }

        #status {
            margin-top: 10px;
            color: #888;
            font-style: italic;
        }
    </style>
</head>

<body>
    <h1>Visual Code Editor</h1>
    <div id="editor-container">
        <div id="canvas-container">
            <canvas id="editor-canvas"></canvas>
        </div>
        <div id="sidebar">
            <div class="control-group">
                <label>Debug Tools:</label>
                <textarea id="text-input" rows="3" placeholder="Paste code here..."
                    style="width: 100%; background: #3c3c3c; color: white; border: 1px solid #555; margin-top: 5px;"></textarea>
                <button id="load-text-btn" style="margin-top: 5px; width: 100%;">Load Text to Grid</button>

                <div style="margin-top: 10px;">
                    <label>Load Image:</label>
                    <input type="file" id="image-input" accept="image/*">
                </div>
            </div>

            <div class="control-group">
                <label>Variable Input:</label>
                <select id="var-type">
                    <option value="identifier">Identifier (Green=1)</option>
                    <option value="number">Number (Green=2)</option>
                </select>
                <input type="text" id="var-input" placeholder="Type char..." maxlength="1">
                <small>Type a character to use as brush.</small>
            </div>

            <div id="palette">
                <!-- Buttons generated by JS -->
            </div>

            <button id="compile-btn">Compile & Download</button>
            <div id="status">Ready</div>
        </div>
    </div>

    <script src="dist/editor_bundle.js"></script>
</body>

</html>
